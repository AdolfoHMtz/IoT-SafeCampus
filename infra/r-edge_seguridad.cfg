! IoT-SafeCampus - R-EDGE (ISR4331): politica de aislamiento y telemetria
! Aplicado y verificado en Packet Tracer el 2026-10-06.
! Nota PT: no soporta la palabra clave "log" en ACLs; los contadores de
! "deny ip any any" (show access-lists) sirven como metrica de bloqueos.

! ---- VLAN10 SENSORES: solo MQTT y registro IoT ----
access-list 110 permit tcp 10.10.10.0 0.0.0.255 host 10.10.50.10 eq 1883
access-list 110 permit tcp 10.10.10.0 0.0.0.255 host 10.10.50.11 eq 80
access-list 110 permit icmp 10.10.10.0 0.0.0.255 10.10.60.0 0.0.0.255 echo-reply
access-list 110 permit icmp 10.10.10.0 0.0.0.255 host 10.10.50.10 echo
access-list 110 deny ip any any

! ---- VLAN20 CAMARAS: solo MQTT y dashboard ----
access-list 120 permit tcp 10.10.20.0 0.0.0.255 host 10.10.50.10 eq 1883
access-list 120 permit tcp 10.10.20.0 0.0.0.255 host 10.10.50.11 eq 80
access-list 120 permit icmp 10.10.20.0 0.0.0.255 10.10.60.0 0.0.0.255 echo-reply
access-list 120 permit icmp 10.10.20.0 0.0.0.255 host 10.10.50.10 echo
access-list 120 deny ip any any

! ---- VLAN30 DOCENTES: sin gestion ni IoT directo ----
access-list 130 permit tcp 10.10.30.0 0.0.0.255 10.10.60.0 0.0.0.255 established
access-list 130 permit icmp 10.10.30.0 0.0.0.255 10.10.60.0 0.0.0.255 echo-reply
access-list 130 deny ip 10.10.30.0 0.0.0.255 10.10.60.0 0.0.0.255
access-list 130 deny ip 10.10.30.0 0.0.0.255 10.10.10.0 0.0.0.255
access-list 130 deny ip 10.10.30.0 0.0.0.255 10.10.20.0 0.0.0.255
access-list 130 deny ip 10.10.30.0 0.0.0.255 10.10.99.0 0.0.0.255
access-list 130 permit ip 10.10.30.0 0.0.0.255 any

! ---- VLAN40 LAB: solo MQTT/HTTP internos + Internet ----
access-list 140 permit tcp 10.10.40.0 0.0.0.255 10.10.60.0 0.0.0.255 established
access-list 140 permit icmp 10.10.40.0 0.0.0.255 10.10.60.0 0.0.0.255 echo-reply
access-list 140 permit tcp 10.10.40.0 0.0.0.255 host 10.10.50.10 eq 1883
access-list 140 permit tcp 10.10.40.0 0.0.0.255 host 10.10.50.11 eq 80
access-list 140 permit icmp 10.10.40.0 0.0.0.255 10.10.50.0 0.0.0.255 echo
access-list 140 deny ip 10.10.40.0 0.0.0.255 10.10.0.0 0.0.255.255
access-list 140 permit ip 10.10.40.0 0.0.0.255 any

! ---- VLAN99 CUARENTENA: solo hacia gestion/IDS ----
access-list 199 permit ip 10.10.99.0 0.0.0.255 10.10.60.0 0.0.0.255
access-list 199 deny ip any any

! ---- INTERNET: solo trafico de retorno ----
access-list 101 permit tcp any 10.10.0.0 0.0.255.255 established
access-list 101 permit icmp any 10.10.0.0 0.0.255.255 echo-reply
access-list 101 permit icmp any 10.10.0.0 0.0.255.255 unreachable
access-list 101 deny ip any any

interface GigabitEthernet0/0/0.10
 ip access-group 110 in
 ip flow monitor IOT-MONITOR input
interface GigabitEthernet0/0/0.20
 ip access-group 120 in
 ip flow monitor IOT-MONITOR input
interface GigabitEthernet0/0/0.30
 ip access-group 130 in
 ip flow monitor IOT-MONITOR input
interface GigabitEthernet0/0/0.40
 ip access-group 140 in
 ip flow monitor IOT-MONITOR input
interface GigabitEthernet0/0/0.99
 ip access-group 199 in
 ip flow monitor IOT-MONITOR input
interface GigabitEthernet0/0/1
 ip access-group 101 in
 ip flow monitor IOT-MONITOR input

! ---- Telemetria hacia IDS-EDGE (10.10.60.10) ----
! Exportador creado por API (pt_apply_netflow): IDS-COLLECTOR, v9, UDP 2055
flow exporter IDS-COLLECTOR
 destination 10.10.60.10
 transport udp 2055
flow monitor IOT-MONITOR
 record netflow-original
 exporter IDS-COLLECTOR
service timestamps log datetime msec
logging host 10.10.60.10
ntp server 10.10.50.10

! ---- Para mover un dispositivo comprometido a cuarentena (ej. SENS-A1) ----
! SW-AULA1(config)# interface FastEthernet0/2
! SW-AULA1(config-if)# switchport access vlan 99
! (y cambiar su IP a 10.10.99.x / gw 10.10.99.1)
